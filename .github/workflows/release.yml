name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  publish-central:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      sign: true
      maven-args: deploy -P releases -DskipTests

  publish-github-packages:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      maven-args: deploy -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}

  github-release:
    needs: [publish-central, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: ./.github/actions/setup-java
      - name: Build release jars
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mvn --batch-mode versions:set -DnewVersion="${VERSION#v}" -DgenerateBackupPoms=false
          mvn --batch-mode package -DskipTests
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: target/pbrawclient-*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
