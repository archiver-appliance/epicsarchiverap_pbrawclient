name: Deploy

on:
  workflow_call:
    inputs:
      maven-args:
        description: Arguments passed to `mvn` for the deploy (e.g. "deploy -P releases").
        type: string
        required: true
      version:
        description: If set, the pom version is set to this (leading "v" stripped) before deploying.
        type: string
        default: ''
      sign:
        description: Import the GPG key and sign artifacts (required for Maven Central).
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: ./.github/actions/setup-java
      - name: Set version from tag
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: mvn --batch-mode versions:set -DnewVersion="${VERSION#v}" -DgenerateBackupPoms=false
      - name: Import GPG key
        if: ${{ inputs.sign }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
      - name: Set up Maven settings
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Deploy
        env:
          DEPLOY_ARGS: ${{ inputs.maven-args }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Not named MAVEN_ARGS: since Maven 3.9 the mvn launcher reads that
          # variable and prepends it to the command line, which would run the
          # goals twice in one lifecycle.
          # DEPLOY_ARGS is a controlled workflow input; word-splitting is intended.
          # shellcheck disable=SC2086
          mvn --batch-mode $DEPLOY_ARGS
