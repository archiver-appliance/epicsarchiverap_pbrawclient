name: Build

on:
  workflow_call:
    inputs:
      os:
        description: Runner to build on.
        type: string
        default: ubuntu-latest
      upload-artifacts:
        description: Upload the built jars (used by the master build).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: ./.github/actions/setup-java
      - name: Build
        run: mvn --batch-mode package -DskipTests
      - name: Archive build artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: pbrawclient-jars
          path: ${{ github.workspace }}/target/pbrawclient-*.jar
